<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login / Sign Up | Play Boy</title>
<link rel="icon" type="image/png" href="81c1d0412d8991a3ae21e2a3d37c46ab.jpg">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: "Poppins", sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background:
    radial-gradient(900px circle at 80% -10%, rgba(59,130,246,0.35), transparent 60%),
    radial-gradient(600px circle at -10% 60%, rgba(59,130,246,0.18), transparent 60%),
    #05070c;
  color: #e5e7eb;
}

/*  CARD  */
.auth-box {
  width: 100%;
  max-width: 460px;
  background: rgba(10,16,32,0.9);
  border-radius: 18px;
  border: 1px solid rgba(255,255,255,0.08);
  padding: 34px;
  backdrop-filter: blur(14px);
  box-shadow: 0 30px 60px rgba(0,0,0,0.6);
}

/*  LOGO  */
.logo {
  display: flex;
  justify-content: center;
  margin-bottom: 22px;
}

.logo img {
  height: 52px;
  object-fit: contain;
  filter: drop-shadow(0 0 12px rgba(59,130,246,0.45));
}

/*  TABS  */
.tabs {
  display: flex;
  background: rgba(255,255,255,0.05);
  border-radius: 12px;
  overflow: hidden;
  margin-bottom: 28px;
}

.tabs label {
  flex: 1;
  text-align: center;
  padding: 12px;
  cursor: pointer;
  font-size: 14px;
  opacity: 0.6;
  transition: 0.3s;
}

input[type="radio"] {
  display: none;
}

#login:checked ~ .tabs label[for="login"],
#signup:checked ~ .tabs label[for="signup"] {
  background: linear-gradient(135deg, #3b82f6, #60a5fa);
  opacity: 1;
  font-weight: 600;
}

/*  FORMS  */
form {
  display: none;
  animation: fade 0.4s ease;
}

#login:checked ~ .login-form {
  display: block;
}

#signup:checked ~ .signup-form {
  display: block;
}

@keyframes fade {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

label.text {
  font-size: 13px;
  opacity: 0.85;
}

input {
  width: 100%;
  margin-top: 6px;
  margin-bottom: 18px;
  padding: 12px 14px;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.1);
  background: rgba(255,255,255,0.05);
  color: #fff;
  outline: none;
}

input:focus {
  border-color: #3b82f6;
}

.hint {
  font-size: 12px;
  opacity: 0.7;
  margin-top: -10px;
  margin-bottom: 16px;
}

/*  BUTTON  */
button {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 12px;
  font-weight: 600;
  font-size: 15px;
  color: #fff;
  background: linear-gradient(135deg, #3b82f6, #60a5fa);
  cursor: pointer;
  transition: 0.2s;
}

button:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 30px rgba(59,130,246,0.45);
}

.note {
  text-align: center;
  font-size: 13px;
  opacity: 0.7;
  margin-top: 18px;
}

.message {
  margin-top: 16px;
  padding: 12px 14px;
  border-radius: 10px;
  font-size: 13px;
  display: none;
}

.message.success {
  display: block;
  background: rgba(16, 185, 129, 0.18);
  border: 1px solid rgba(16, 185, 129, 0.35);
  color: #a7f3d0;
}

.message.error {
  display: block;
  background: rgba(239, 68, 68, 0.18);
  border: 1px solid rgba(239, 68, 68, 0.35);
  color: #fecaca;
}
</style>
</head>

<body>

<div class="auth-box">

  <!-- LOGO -->
  <div class="logo">
    <img src="logo.png" alt="Play Boy Logo">
  </div>

  <!-- RADIO CONTROLS -->
  <input type="radio" name="tab" id="login" checked>
  <input type="radio" name="tab" id="signup">

  <!-- TABS -->
  <div class="tabs">
    <label for="login">Login</label>
    <label for="signup">Sign Up</label>
  </div>

  <!-- LOGIN FORM -->
  <form class="login-form" id="login-form" action="mainpage.html" method="get">
    <label class="text">Email</label>
    <input type="email" id="login-email" placeholder="you@example.com" required>

    <label class="text">Password</label>
    <input type="password" id="login-password" placeholder="••••••••" required>

    <button type="submit">Login</button>
    <div class="note">Sign in to sell your gear</div>
    <p class="message" id="login-message" role="status" aria-live="polite"></p>
  </form>

  <!-- SIGN UP FORM -->
  <form class="signup-form" id="signup-form" action="mainpagee.html" method="get">
    <label class="text">Full Name</label>
    <input type="text" id="signup-name" placeholder="John Doe" required>

    <label class="text">Email</label>
    <input type="email" id="signup-email" placeholder="you@example.com" required>

    <label class="text">Password</label>
    <input
      type="password"
      id="signup-password"
      placeholder="Create password"
      minlength="8"
      aria-describedby="password-hint"
      required
    >
    <div class="hint" id="password-hint">Minimum 8 characters.</div>

    <label class="text">Confirm Password</label>
    <input
      type="password"
      id="signup-confirm"
      placeholder="Repeat password"
      minlength="8"
      required
    >

    <button type="submit">Create Account</button>
    <div class="note">Join Play Boy & start trading</div>
    <p class="message" id="signup-message" role="status" aria-live="polite"></p>
  </form>
</div>

<script>
  const loginForm = document.getElementById("login-form");
  const signupForm = document.getElementById("signup-form");
  const loginMessage = document.getElementById("login-message");
  const signupMessage = document.getElementById("signup-message");

  const REDIRECT_DELAY_AFTER_SUCCESS_MS = 3000;

  const runHtmlValidation = (form) => form.reportValidity();

  const setMessage = (target, text, type) => {
    target.textContent = text;
    target.className = `message ${type}`;
  };

  const clearMessages = () => {
    [loginMessage, signupMessage].forEach((target) => {
      target.textContent = "";
      target.className = "message";
    });
  };

  loginForm.addEventListener("submit", (event) => {
    event.preventDefault();
    clearMessages();

    if (!runHtmlValidation(loginForm)) {
      return;
    }

    setMessage(loginMessage, "Welcome back! Redirecting...", "success");
    setTimeout(() => {
      window.location.href = loginForm.action;
    }, REDIRECT_DELAY_AFTER_SUCCESS_MS);
  });

  signupForm.addEventListener("submit", (event) => {
    event.preventDefault();
    clearMessages();

    if (!runHtmlValidation(signupForm)) {
      return;
    }

    const password = document.getElementById("signup-password").value;
    const confirm = document.getElementById("signup-confirm").value;

    if (password !== confirm) {
      setMessage(signupMessage, "Passwords do not match. Try again.", "error");
      return;
    }

    setMessage(signupMessage, "Account created! Taking you to the store...", "success");
    setTimeout(() => {
      window.location.href = signupForm.action;
    }, REDIRECT_DELAY_AFTER_SUCCESS_MS);
  });
</script>
</body>
</html>
